name: mystery_box_app
description: Hyperlocal surplus food marketplace

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # For modern UI components
  cupertino_icons: ^1.0.2
  
  # For Maps and Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  
  # For Backend API calls
  http: ^1.1.0
  
  # For state management
  provider: ^6.1.1
  
  # For payments and push notifications (We will configure these later)
  # razorpay_flutter: ^1.3.5
  # firebase_messaging: ^14.7.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
